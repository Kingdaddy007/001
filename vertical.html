<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path A: Infinite Vertical Rooms</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    /* Clean overrides for vertical loop */
    body, html { margin: 0; padding: 0; background: #000; color: white; }
    .infinite-wrapper { position: relative; height: 100svh; overflow: hidden; }
    .infinite-content { position: relative; }
    .room-section { position: relative; width: 100%; height: 100svh; overflow: clip; display: grid; place-items: center; z-index: 1; }
    .room-video-container { position: absolute; inset: 0; z-index: 1; background: #000; }
    .room-video-container video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
    
    .room-title { 
      font-family: "Helvetica Neue", Helvetica, sans-serif; 
      font-size: 8vw; 
      color: white; 
      text-transform: uppercase; 
      letter-spacing: -0.04em; 
      z-index: 10; 
      mix-blend-mode: difference; 
      text-align: center;
    }

    .nav-overlay { 
      position: fixed; 
      top: 2rem; 
      left: 2rem; 
      z-index: 100; 
      font-family: monospace; 
      background: rgba(0,0,0,0.5);
      padding: 1rem;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    .nav-overlay a { color: white; text-decoration: none; display: block; margin-bottom: 0.5rem; }
    .nav-overlay a:hover { color: #aaa; }
  </style>
</head>
<body>
  <div class="nav-overlay">
    <a href="/">← Back to Original</a>
    <a href="/horizontal.html">→ View Path B (Horizontal)</a>
  </div>
  
  <div class="infinite-wrapper">
    <div class="infinite-content">
      
      <!-- Room 1 -->
      <section class="room-section" id="room-1">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Tracking_forward_dust_motes_fire_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">01 / THE MONOLITH</h1>
      </section>
      
      <!-- Room 2 -->
      <section class="room-section" id="room-2">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Steam_rises_from_bathtub_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">02 / THE SANCTUARY</h1>
      </section>
      
      <!-- Room 3 -->
      <section class="room-section" id="room-3">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Slow_push-in_toward_ottoman_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">03 / THE VAULT</h1>
      </section>
      
      <!-- Room 4 -->
      <section class="room-section" id="room-4">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Tracking_shot_down_hallway_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">04 / THE CORRIDOR</h1>
      </section>
      
      <!-- Room 5 -->
      <section class="room-section" id="room-5">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Leather_chair_slow_zoom_dust_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">05 / THE STUDY</h1>
      </section>
      
      <!-- Room 6 -->
      <section class="room-section" id="room-6">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Static_camera_subtle_pan_left_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">06 / THE ARCHIVE</h1>
      </section>
      
      <!-- Room 1 Cloned for Seamless Infinite Wrap -->
      <section class="room-section" aria-hidden="true">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Tracking_forward_dust_motes_fire_202606091909.mp4"></video>
        </div>
        <h1 class="room-title">01 / THE MONOLITH</h1>
      </section>

    </div>
  </div>
  
  <script type="module" src="/src/vertical.ts"></script>
</body>
</html>
