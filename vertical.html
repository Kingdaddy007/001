<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path A: Infinite 3D Carousel Rooms</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    /* Clean overrides for vertical loop */
    body, html { margin: 0; padding: 0; background: #000; color: white; overflow-x: hidden; height: 600vh; }
    
    /* Fixed container for the 3D perspective */
    .infinite-wrapper { 
      position: fixed; 
      top: 0;
      left: 0;
      width: 100%;
      height: 100svh; 
      overflow: hidden; 
      perspective: 1200px;
      transform-style: preserve-3d;
      z-index: 1;
      pointer-events: none; /* Let scroll hit the track */
    }

    .infinite-content { 
      position: absolute; 
      top: 50%;
      left: 50%;
      width: 85vw;
      height: 75vh;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
    }

    /* The cinematic cards */
    .room-section { 
      position: absolute; 
      top: 0;
      left: 0;
      width: 100%; 
      height: 100%; 
      display: grid; 
      place-items: center; 
      border-radius: 32px;
      overflow: hidden;
      background: #000;
      backface-visibility: hidden;
      will-change: transform, opacity;
      /* Box shadow to enhance depth */
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      pointer-events: auto;
    }
    
    .room-video-container { position: absolute; inset: 0; z-index: 1; background: #000; }
    .room-video-container video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
    
    /* Vignette overlay for text legibility */
    .room-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
      z-index: 2;
    }

    .room-title { 
      font-family: "Helvetica Neue", Helvetica, sans-serif; 
      font-size: clamp(3rem, 6vw, 6rem); 
      color: #F5F5F0; 
      text-transform: uppercase; 
      letter-spacing: -0.04em; 
      z-index: 10; 
      text-align: center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    /* Central Pinned SCROLL Indicator */
    .scroll-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border: 1px dashed rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-family: monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    .nav-overlay { 
      position: fixed; 
      top: 2rem; 
      left: 2rem; 
      z-index: 100; 
      font-family: monospace; 
      background: rgba(0,0,0,0.5);
      padding: 1rem;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    .nav-overlay a { color: white; text-decoration: none; display: block; margin-bottom: 0.5rem; }
    .nav-overlay a:hover { color: #aaa; }
  </style>
</head>
<body>
  <div class="nav-overlay">
    <a href="/">← Back to Original</a>
    <a href="/horizontal.html">→ View Path B (Horizontal)</a>
  </div>
  
  <div class="scroll-ring">SCROLL</div>

  <!-- The fixed 3D Scene -->
  <div class="infinite-wrapper">
    <div class="infinite-content">
      
      <!-- Room 1 -->
      <section class="room-section card">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Tracking_push_through_portico_202606112043.mp4"></video>
        </div>
        <div class="room-vignette"></div>
        <h1 class="room-title">01 / THE MONOLITH</h1>
      </section>
      
      <!-- Room 2 -->
      <section class="room-section card">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Steam_rises_from_bathtub_202606091909.mp4"></video>
        </div>
        <div class="room-vignette"></div>
        <h1 class="room-title">02 / THE SANCTUARY</h1>
      </section>
      
      <!-- Room 3 -->
      <section class="room-section card">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Slow_push-in_toward_ottoman_202606091909.mp4"></video>
        </div>
        <div class="room-vignette"></div>
        <h1 class="room-title">03 / THE VAULT</h1>
      </section>
      
      <!-- Room 4 -->
      <section class="room-section card">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Tracking_shot_down_hallway_202606091909.mp4"></video>
        </div>
        <div class="room-vignette"></div>
        <h1 class="room-title">04 / THE CORRIDOR</h1>
      </section>
      
      <!-- Room 5 -->
      <section class="room-section card">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Slow_push_into_sunken_salon_202606112050.mp4"></video>
        </div>
        <div class="room-vignette"></div>
        <h1 class="room-title">05 / THE STUDY</h1>
      </section>
      
      <!-- Room 6 -->
      <section class="room-section card">
        <div class="room-video-container">
          <video autoplay muted loop playsinline src="/videos/Static_camera_subtle_pan_left_202606091909.mp4"></video>
        </div>
        <div class="room-vignette"></div>
        <h1 class="room-title">06 / THE ARCHIVE</h1>
      </section>

    </div>
  </div>
  
  <script type="module" src="/src/vertical.ts"></script>
</body>
</html>
