<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .layer-foreground { z-index: 20; border-radius: 40px; }
        .layer-background { z-index: 10; position: sticky; top: 0; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans overflow-x-hidden">
    <div class="relative w-full h-[350vh]">
        <div class="layer-foreground relative w-full h-screen bg-white text-black p-8 shadow-2xl">
            <h1>Layer 1: Foreground</h1>
        </div>
        <div class="layer-background w-full h-screen bg-zinc-900 text-white p-8">
            <h1>Layer 2: Sticky Underlay</h1>
        </div>
        <div class="layer-foreground relative w-full h-screen bg-blue-900 text-white p-8 shadow-2xl">
            <h1>Layer 3: Foreground</h1>
        </div>
    </div>
</body>
</html>
