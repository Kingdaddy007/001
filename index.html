<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- High-end typography. Using 'Inter' for clean, premium spatial aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <title>The Sanctuary Return</title>
  </head>
  <body>
    <main id="lenis-wrapper">
      
      <!-- Spatial Hero Event -->
      <section class="hero-container">
        <!-- The Sanctuary Video (Scroll-Scrubbed) -->
        <div class="sanctuary">
          <video 
            class="sanctuary-video"
            src="/Camera_push_into_room_202606091453.mp4" 
            poster="/Rectangle%20(5).png"
            preload="auto"
            autoplay loop muted playsinline>
          </video>
        </div>
        
        <!-- The Threshold Veil -->
        <div class="threshold">
          <h1 class="threshold-text">THE NOISE STAYS OUTSIDE.</h1>
        </div>

        <!-- The Punchlines (Apple-Style Text Masks) -->
        <div class="punchline-container">
          <div class="punchline-mask">
            <h2 class="punchline-text">WE DO NOT DECORATE.</h2>
          </div>
          <div class="punchline-mask">
            <h2 class="punchline-text">WE SCULPT VOLUME AND LIGHT.</h2>
          </div>
          <div class="punchline-mask">
            <h2 class="punchline-text">EVERY ROOM IS A THRESHOLD.</h2>
          </div>
        </div>

        <!-- Quiet Spatial UI Pattern -->
        <nav class="quiet-nav">
          <div class="brand">THE SANCTUARY</div>
          <div class="concierge-inquiry" tabindex="0">Request a consultation</div>
        </nav>
      </section>

      <!-- Proof/Method Section (Stacked Card Transition) -->
      <section class="method-section">
        <div class="method-background">
          <!-- Temporary placeholder: wait for user's new asset -->
          <img src="/Rectangle%20(5).png" alt="Methodology Background">
        </div>
        <div class="method-content">
          <h2 class="method-heading">METHODOLOGY & RIGOR</h2>
          <p class="method-body">True architecture is not the addition of ornament, but the curation of silence.</p>
        </div>
      </section>
      
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
